name: simtc
description: App de Avaliação de Treinamentos - SIM Treinamentos
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Arquitetura oficial Flutter (MVVM)
  provider: ^6.1.2

  # Navegação
  go_router: ^14.0.0

  # HTTP
  dio: ^5.7.0

  # Storage local (offline-first com SQLite)
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  path_provider: ^2.1.4

  # Auth / tokens
  flutter_secure_storage: ^9.2.2

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1

  # Utilitários
  intl: ^0.19.0
  connectivity_plus: ^6.0.5
  uuid: ^4.4.2

  # Visualizar relatórios PDF
  pdfx: ^2.7.0

  # Serialização JSON
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation (Drift + JSON)
  drift_dev: ^2.18.0
  build_runner: ^2.4.12
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/